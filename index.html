<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Ten Trade · Curiosity Engine Learn</title>
<meta name="description" content="An interactive base-ten lesson: discover why regrouping works in two-digit subtraction, with Ollie the Otter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CURIOSITY ENGINE · LEARN THEME (Blue Learn Series)
   Swap these tokens to re-theme future Learn lessons.
   ========================================================= */
:root{
  --blue:#2C6FD1; --blue-dk:#1F56A8; --blue-lt:#DCEEFF; --blue-xlt:#F2F8FF;
  --teal:#149DA1; --teal-dk:#0B7275; --gold:#F5BD58; --gold-dk:#C98A1B; --gold-ink:#7A5200;
  --ink:#1C2B44; --ink-soft:#4A5A75; --line:#C9DDF5;
  --ok:#1E7F52; --ok-bg:#E8F7EF;
  --radius:20px; --shadow:0 6px 22px rgba(28,43,68,.10);
  --font: "Andika", ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
  --cube: clamp(30px, 7.4vw, 42px);
  --seg: clamp(14px, 3.3vw, 19px);
  --rodw: clamp(24px, 6vw, 32px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(1100px 520px at 8% -8%, #E6F1FF 0, transparent 60%),linear-gradient(#F7FBFF,#fff 60%)}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:10px;z-index:50}
.skip:focus{left:8px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px);background:var(--blue);color:#fff;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.12);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.22)}
.pill[aria-pressed="true"]{background:#fff;color:var(--blue-dk);border-color:#fff}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand small{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;opacity:.92;font-weight:700}
.brand strong{font-size:clamp(1.05rem,2.6vw,1.35rem)}
.learn-chip{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;font-size:.66rem;padding:2px 8px;border-radius:999px;margin-left:6px;letter-spacing:.08em;vertical-align:1px}
.topbar .right{margin-left:auto;display:flex;gap:8px}

/* ---------- Progress ---------- */
.progress{width:min(1180px,100%);margin:0 auto;padding:12px clamp(10px,2.5vw,24px) 0}
.progress ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;align-items:center}
.progress li{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.progress li:not(:last-child)::after{content:"";flex:1;height:4px;border-radius:4px;background:var(--blue-lt)}
.progress li.done:not(:last-child)::after{background:var(--teal)}
.dot{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;font-weight:900;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;padding:0}
.dot[disabled]{cursor:not-allowed;opacity:.55}
.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.dot[aria-current="step"]{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-lt)}
.step-name{font-weight:800;color:var(--blue-dk);font-size:.92rem;margin:8px 0 0}

/* ---------- Stage ---------- */
.stage{flex:1;width:min(1180px,100%);margin:0 auto;padding:12px clamp(10px,2.5vw,24px) 18px;display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.guide{position:sticky;top:12px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:2px solid var(--blue-lt);text-align:center;z-index:5}
.ollie-wrap{display:flex;justify-content:center}
.ollie{width:205px;height:auto;display:block;transform-origin:50% 90%}
.ollie.mood-wow{animation:jump .5s ease}
.ollie.mood-cheer{animation:cheer .9s ease}
.ollie.mood-think{animation:tilt .7s ease}
.ollie.mood-happy,.ollie.mood-wave,.ollie.mood-neutral{animation:bob .5s ease}
.bubble{position:relative;background:var(--blue-xlt);border:2px solid var(--blue-lt);border-radius:18px;padding:12px 14px;font-size:1.12rem;line-height:1.45;text-align:left;margin-top:10px}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:12px solid var(--blue-lt)}
.bubble.fresh{animation:pop .35s ease}
.bubble b{color:var(--blue-dk)}
.guide-actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.work{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(14px,2.5vw,24px);border:2px solid var(--blue-lt);min-height:420px;min-width:0}

/* ---------- Buttons ---------- */
.btn{min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:1.02rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s, box-shadow .12s;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dk)}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-dk)}
.btn-teal{background:var(--teal-dk);color:#fff;box-shadow:0 4px 0 #075457}
.btn-soft{background:#fff;color:var(--blue-dk);border-color:var(--line)}
.btn-soft:hover{border-color:var(--blue)}
.btn-big{min-height:58px;font-size:1.2rem;padding:12px 26px}
.btn-sm{min-height:40px;font-size:.88rem;padding:6px 12px}
.btn[aria-disabled="true"]{opacity:.5;box-shadow:none}
.btn.ready{animation:ready 1.6s ease-in-out infinite}
.shake{animation:shake .4s ease}

/* ---------- Moment layout ---------- */
.moment-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kicker{color:var(--teal-dk);font-weight:900;text-transform:uppercase;font-size:.78rem;letter-spacing:.09em}
.work-title{font-family:"Fredoka",var(--font);font-weight:600;margin:2px 0 0;font-size:clamp(1.35rem,3vw,1.75rem);outline:none}
.problem{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;background:var(--blue-xlt);border:2px solid var(--blue-lt);border-radius:16px;padding:8px 16px;margin-bottom:12px}
.problem .big{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:900;font-variant-numeric:tabular-nums}
.problem .sub{color:var(--ink-soft);font-weight:800}
.meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;margin:4px 0 10px}
.ticks{display:flex;gap:5px}
.tick{width:20px;height:20px;border-radius:6px;border:2px dashed var(--gold-dk)}
.tick.on{background:var(--gold);border-style:solid}
.tick.t{width:14px;height:30px;border-color:var(--blue)}
.tick.t.on{background:var(--blue)}

/* ---------- Base-ten mat (reusable) ---------- */
.mat{display:grid;grid-template-columns:auto 1fr;gap:12px}
.col{border-radius:16px;padding:10px;position:relative;transition:box-shadow .2s;min-width:0}
.col.tens{background:#EDF5FF;border:2px solid #BFD8F7}
.col.ones{background:#FFF7E6;border:2px solid #F0D49B}
.col.hl{box-shadow:0 0 0 4px var(--teal),0 0 18px rgba(20,157,161,.35)}
.col.drop-over{box-shadow:0 0 0 5px var(--gold)}
.col.zone{cursor:pointer}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;margin-bottom:8px}
.col.tens .col-head{color:var(--blue-dk)}
.col.ones .col-head{color:var(--gold-ink)}
.badge{background:#fff;border-radius:999px;padding:1px 10px;border:2px solid currentColor;font-variant-numeric:tabular-nums}
.rods{display:flex;gap:6px;align-items:flex-end;min-height:calc(var(--seg)*10 + 12px);min-width:calc((var(--rodw) + 14px)*4)}
.rod{appearance:none;border:0;background:transparent;padding:4px;border-radius:10px;display:flex;flex-direction:column;touch-action:none;position:relative;transition:transform .15s}
button.rod,button.cube{cursor:pointer}
.rod .seg{display:block;width:var(--rodw);height:var(--seg);background:linear-gradient(90deg,#5793EA,#2C6FD1 60%,#2461BD);border:1.5px solid #164789;border-bottom-width:0}
.rod .seg:first-child{border-radius:5px 5px 0 0}
.rod .seg:last-child{border-bottom-width:1.5px;border-radius:0 0 5px 5px}
.rod.selected{outline:4px solid var(--gold);background:rgba(245,189,88,.3);transform:translateY(-8px)}
.rod.counted .seg{background:linear-gradient(90deg,#7CB0F5,#4C8BE6);}
.rod.counted{outline:3px solid var(--teal)}
.cubes{display:grid;grid-template-columns:repeat(5,var(--cube));gap:5px;align-content:start;min-height:calc(var(--cube)*2 + 5px)}
.cube{width:var(--cube);height:var(--cube);appearance:none;border:0;padding:3px;background:transparent;border-radius:8px;touch-action:none;position:relative}
.cube .face{display:block;width:100%;height:100%;background:linear-gradient(135deg,#FFDA8F,#F5BD58 55%,#E5A437);border:1.5px solid #946510;border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.cube.fresh .face{animation:glow 1.8s ease-in-out infinite}
.cube.counted .face{outline:3px solid var(--teal);outline-offset:1px}
.num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.95rem;color:var(--ink);pointer-events:none}
.rod .num{background:rgba(255,255,255,.85);border-radius:8px;inset:auto 0 -4px 0;height:22px;font-size:.8rem}
.cube.pop .face{animation:popin .35s ease}
.hl-blocks .face{outline:3px dashed var(--teal);outline-offset:1px}
.hl-blocks.rod{outline:3px dashed var(--teal)}
.tray{margin-top:10px;border:2.5px dashed #AFC3DD;border-radius:16px;padding:6px 12px;min-height:54px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#FAFCFF}
.tray.drop-over{border-color:var(--gold);background:#FFF8E8}
.tray-label{font-weight:800;color:var(--ink-soft);font-size:.88rem;margin-right:6px}
.tray-empty{color:#8A97AD;font-size:.86rem}
.tray .cube{--cube:30px}
.tray .rod{--seg:6.5px;--rodw:14px;padding:3px}
.gone .face,.gone .seg{filter:grayscale(.9);opacity:.5}
.gone::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:3px;background:#5E6B80;transform:rotate(-35deg);border-radius:2px}
.gone.drop{animation:dropin .35s ease}
.compact{--cube:22px;--seg:9px;--rodw:16px}
.compact .cubes{gap:3px;min-height:0}
.compact .rods{min-height:calc(var(--seg)*10 + 8px);min-width:0;gap:3px}
.compact .rod{padding:2px}
.compact .col{padding:6px}
.compact .col-head{font-size:.85rem;margin-bottom:4px}
.compact .tray{min-height:40px;padding:4px 8px}
.compact .tray .cube{--cube:18px}
.drag-ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:999;opacity:.92;transform-origin:center}
.dragging{opacity:.3}
.ghost-cube{position:fixed;z-index:998;pointer-events:none;border-radius:4px;background:linear-gradient(135deg,#FFDA8F,#F5BD58 55%,#E5A437);border:1.5px solid #946510}

/* ---------- "Touch me next" cues ---------- */
button.rod.cue,button.cube.cue{outline:3px solid var(--gold);outline-offset:2px;animation:cue 1.3s ease-in-out infinite;z-index:2}
.btn.cue,.choice.cue,.pad-display.cue,.pbtn.cue{box-shadow:0 0 0 4px var(--gold);animation:cueSoft 1.3s ease-in-out infinite}
.choice.cue{border-color:var(--gold)}
.cue.hand::after{content:"👆";position:absolute;left:50%;top:100%;margin-top:2px;font-size:28px;line-height:1;pointer-events:none;animation:hand 1s ease-in-out infinite;z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.btn.cue.hand,.pbtn.cue.hand{position:relative}
.pcard .target{box-shadow:0 0 0 5px rgba(245,189,88,.9);animation:cueSoft 1.3s ease-in-out infinite}
.pdigit.colfocus{background:#FFF1D6;box-shadow:0 0 0 3px var(--gold);animation:cueSoft 1.3s ease-in-out infinite}
.pwork:disabled,.pbox:disabled{opacity:.45}


/* ---------- Need strip + big number ---------- */
.need{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:4px 0 12px;padding:10px 14px;border-radius:14px;background:#FFF7E6;border:2px solid #F0D49B}
.need .lbl{font-weight:900;color:var(--gold-ink)}
.need .slots{display:flex;gap:5px;flex-wrap:wrap}
.need .sl{width:30px;height:30px;border-radius:6px;border:2.5px dashed var(--gold-dk);background:#fff}
.need .sl.on{background:linear-gradient(135deg,#FFDA8F,#F5BD58 55%,#E5A437);border:1.5px solid #946510}
.need .xtra{font-weight:900;color:var(--gold-ink)}
.need .verdict{font-weight:900;padding:3px 12px;border-radius:10px}
.need .verdict.short{background:#FCEAEA;color:#A02C2C}
.need .verdict.ok{background:var(--ok-bg);color:var(--ok)}
.bignum{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:0 0 12px;padding:10px 16px;border-radius:16px;background:var(--blue-xlt);border:2px solid var(--blue-lt)}
.bn-label{font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;font-size:.9rem}
.bn{font-family:"Fredoka",var(--font);font-weight:600;font-size:clamp(2.6rem,8vw,3.4rem);line-height:1;color:var(--teal-dk);font-variant-numeric:tabular-nums}
.bn-badge{background:var(--ok);color:#fff;font-weight:900;padding:6px 14px;border-radius:999px;font-size:1.05rem}
.bignum.still{border-color:#9ED8B9;background:var(--ok-bg);animation:pop .5s ease}


/* ---------- Focus card (main frame) + problem tracker (guide panel) ---------- */
.focus-card{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;border-radius:16px;padding:8px 18px;margin-bottom:12px;border:2px solid}
.focus-card.ones{background:#FFF7E6;border-color:#F0D49B}
.focus-card.tens{background:#EDF5FF;border-color:#BFD8F7}
.fc-place{font-family:"Fredoka",var(--font);font-weight:600;font-size:1.15rem;padding:4px 14px;border-radius:999px}
.ones .fc-place{background:var(--gold);color:var(--ink)}
.tens .fc-place{background:var(--blue);color:#fff}
.fc-expr{font-family:"Fredoka",var(--font);font-weight:600;font-size:clamp(2rem,6vw,2.6rem);font-variant-numeric:tabular-nums}
.fc-sub{color:var(--ink-soft);font-weight:800}
#tracker{margin-top:14px}
.tracker{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;text-align:left}
.tracker.slide-in{animation:slideIn .6s cubic-bezier(.25,1,.4,1)}
.tr-label{font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tr-prob{font-family:"Fredoka",var(--font);font-weight:600;font-size:1.7rem;line-height:1.2;margin-bottom:6px}
.tr-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;margin-top:4px;color:var(--ink-soft);font-weight:800;border:2px solid transparent}
.tr-place{font-size:.8rem;padding:1px 8px;border-radius:999px;background:#EEF1F6}
.tr-row.ones.now{background:#FFF7E6;border-color:var(--gold);color:var(--ink)}
.tr-row.tens.now{background:#EDF5FF;border-color:var(--blue);color:var(--ink)}
.tr-row.now .tr-place{background:var(--gold);color:var(--ink)}
.tr-row.tens.now .tr-place{background:var(--blue);color:#fff}
.tr-row.done{color:var(--ok)}
.tr-expr{flex:1;font-variant-numeric:tabular-nums}
.tr-tick{font-weight:900}
.tr-now{font-size:.75rem;font-weight:900;text-transform:uppercase;color:var(--gold-ink)}
.tr-final{margin-top:8px;padding:6px 8px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:900;font-size:1.15rem;text-align:center}
@keyframes slideIn{0%{transform:translateX(240px);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:860px){
  #tracker{grid-column:1/-1;margin-top:4px}
  .tracker{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 8px}
  .tr-label{display:none}
  .tr-prob{font-size:1.15rem;margin:0 4px 0 0}
  .tr-row{margin:0;padding:2px 6px;font-size:.9rem}
  .tr-final{margin:0;font-size:.95rem;padding:2px 8px}
}

/* ---------- Equations ---------- */
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:clamp(1.05rem,2.8vw,1.35rem);font-weight:900;margin-top:12px;padding:10px;border-radius:14px;background:var(--blue-xlt)}
.chip{padding:3px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.chip.t{background:var(--blue);color:#fff}
.chip.o{background:var(--gold);color:var(--ink)}
.chip.v{background:var(--teal-dk);color:#fff}
.eq.muted{background:#F3F5F9;color:var(--ink-soft)}
.eq.muted .chip{opacity:.75}
.eq-label{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin:12px 0 -6px}

/* ---------- Choices, pad, banners ---------- */
.choices{display:grid;gap:10px;margin-top:14px}
.choice{text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2.5px solid var(--line);background:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;display:flex;gap:12px;align-items:center}
.choice:hover{border-color:var(--blue)}
.choice .mark{flex:none;width:40px;height:40px;font-size:1.3rem;border-radius:50%;display:grid;place-items:center;background:var(--blue-lt);color:var(--blue-dk);font-weight:900}
.choice.tried{border-style:dashed;color:var(--ink-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .mark{background:var(--ok);color:#fff}
.ask{margin-top:14px;padding:14px;border-radius:16px;background:#F1FAFA;border:2px solid #BCE4E5}
.ask-q{font-weight:900;font-size:1.15rem;margin:0 0 10px}
.pad-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pad-display{min-width:100px;height:68px;border-radius:14px;border:3px solid var(--teal);display:grid;place-items:center;font-size:2.1rem;font-weight:900;background:#fff;font-variant-numeric:tabular-nums;padding:0 12px}
.pad-display.empty{color:#9AA8BC}
.pad{display:grid;grid-template-columns:repeat(5,52px);gap:7px}
.key{height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:1.3rem;cursor:pointer}
.key:hover{border-color:var(--blue)}
.key.wide{grid-column:span 2;font-size:1rem}
.key.check{grid-column:span 3;background:var(--teal-dk);border-color:var(--teal-dk);color:#fff;font-size:1.05rem}
.extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--ok-bg);border:2px solid #9ED8B9;font-weight:900;font-size:clamp(1.05rem,2.6vw,1.3rem);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.key-idea{background:#FFF6E0;border-color:var(--gold)}
.action-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tip{color:var(--ink-soft);font-size:.92rem;font-weight:700}

/* ---------- Compare ---------- */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cmp{border:2px solid var(--line);border-radius:16px;padding:10px;background:#FBFDFF}
.cmp h3{margin:0 0 6px;font-size:1rem}
.cmp .sum{font-weight:900;font-size:1.1rem;margin:8px 0;text-align:center}
.total{display:inline-grid;place-items:center;min-width:56px;height:40px;border-radius:12px;background:var(--teal-dk);color:#fff;font-weight:900;font-size:1.2rem;padding:0 10px}
.cmp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- Written algorithm ---------- */
.algo-layout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.side{flex:1 1 200px;min-width:200px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.side .links{width:100%}
.bench{margin-top:16px;padding:14px;border:2px solid var(--blue-lt);border-radius:18px;background:#FBFDFF}
.bench-title{margin:0 0 4px;font-size:1.05rem;color:var(--blue-dk)}
.mat{min-width:0}
.links{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.links li{background:var(--blue-xlt);border-radius:12px;padding:8px 12px;font-weight:700}
.links b{color:var(--teal-dk)}

/* ---------- Welcome & finish ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}
.legend .item{display:flex;align-items:center;gap:12px;background:var(--blue-xlt);border-radius:16px;padding:12px 16px;font-weight:900;font-size:1.1rem}
.lede{font-size:1.15rem;line-height:1.5;color:var(--ink-soft);max-width:56ch}
.learned{background:var(--blue-xlt);border-radius:16px;padding:14px 18px;margin:14px 0}
.learned h3{margin:0 0 8px}
.learned ul{margin:0;padding-left:1.2em;line-height:1.7;font-weight:700}
.next-steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn-pip{background:#5B3FA8;color:#fff;box-shadow:0 4px 0 #3E2A78}


/* ---------- Practice-style problem card (matches the Pip practice tool) ---------- */
.pcard{--p-accent:#7248B4;--p-accent-soft:#F0E9FA;--p-red:#D63A3A;--p-red-soft:#FCEAEA;--p-green:#157A4A;--p-green-soft:#E4F6EC;--p-ink:#1E2430;--p-muted:#5C6577;--cell:66px;
  background:#fff;border-radius:22px;padding:26px 20px 24px;box-shadow:0 6px 0 var(--p-accent-soft);border:2px solid var(--p-accent-soft);
  font-family:'Andika','Comic Sans MS',Verdana,sans-serif;color:var(--p-ink);font-size:18px;line-height:1.5;flex:1 1 330px;min-width:0}
.pkind{font-family:'Fredoka',sans-serif;font-size:20px;color:var(--p-accent);text-align:center;margin:0 0 4px}
.phint{font-size:16px;color:var(--p-muted);text-align:center;margin:0 0 20px}
.pgrid{display:grid;gap:9px;justify-content:center;align-items:center;grid-template-columns:repeat(3,var(--cell))}
.pdigit{height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;position:relative;border-radius:12px}
.pdigit.tap{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pdigit.tap:hover{background:var(--p-accent-soft)}
.pdigit.tap:focus-visible{outline:3px solid var(--p-accent);outline-offset:2px}
.pdigit.struck::after{content:"";position:absolute;left:14%;right:14%;top:48%;height:5px;border-radius:3px;background:var(--p-red);transform:rotate(-40deg)}
.pop{font-size:40px;font-weight:700;color:var(--p-muted);display:flex;align-items:center;justify-content:center;height:var(--cell)}
.pbox{width:var(--cell);height:var(--cell);font-size:38px;font-weight:700;text-align:center;border:3px dashed #8A82A0;border-radius:14px;background:#FCFBFE;color:var(--p-ink);padding:0;font-family:'Andika',Verdana,sans-serif}
.pbox:focus{outline:none;border-color:var(--p-accent);border-style:solid;background:#fff;box-shadow:0 0 0 4px var(--p-accent-soft)}
.pbox.wrong{border-color:var(--p-red);border-style:solid;background:var(--p-red-soft);animation:shake .4s}
.pwork{height:48px;width:var(--cell);font-size:26px;font-weight:700;text-align:center;border:3px dashed var(--p-green);border-radius:12px;background:var(--p-green-soft);color:var(--p-green);padding:0;justify-self:center;font-family:'Andika',Verdana,sans-serif}
.pwork:focus{outline:none;border-style:solid;box-shadow:0 0 0 4px #D3EFE0}
.pwork.wrong{border-color:var(--p-red);border-style:solid;background:var(--p-red-soft);color:#A02C2C;animation:shake .4s}
.prule{grid-column:1/-1;height:6px;background:var(--p-ink);border-radius:3px;margin:4px 0}
.pfeedback{min-height:30px;text-align:center;margin:20px 0 4px;font-size:20px;font-family:'Fredoka',sans-serif}
.pfeedback.good{color:var(--p-green)}
.pfeedback.fix{color:var(--p-red)}
.pactions{display:flex;gap:12px;justify-content:center;margin-top:12px}
.pbtn{border:none;border-radius:14px;padding:14px 30px;color:#fff;font-size:19px;font-family:'Fredoka',sans-serif;background:var(--p-accent);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}
.pbtn:active{transform:translateY(3px);box-shadow:none}
@media (max-width:560px){.pcard{--cell:54px;padding:20px 12px}.pdigit{font-size:36px}.pbox{font-size:30px}.pwork{font-size:22px;height:46px}}
@media (max-width:380px){.pcard{--cell:46px}.pgrid{gap:6px}.pdigit{font-size:30px}.pop{font-size:30px}.pbox{font-size:26px}.pwork{font-size:20px;height:44px}}

/* ---------- Bottom nav & footer ---------- */
.controls{position:sticky;bottom:0;z-index:10;background:rgba(255,255,255,.96);border-top:2px solid var(--blue-lt);padding:10px clamp(12px,3vw,28px)}
.controls-in{width:min(1180px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.controls .where{font-weight:800;color:var(--ink-soft);text-align:center;font-size:.95rem}
footer{text-align:center;color:var(--ink-soft);font-size:.82rem;padding:10px 12px 16px}

/* ---------- Animations ---------- */
@keyframes bob{40%{transform:translateY(-6px)}}
@keyframes jump{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0)}}
@keyframes cheer{20%{transform:translateY(-12px) rotate(-5deg)}45%{transform:translateY(0) rotate(4deg)}70%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes tilt{40%{transform:rotate(-6deg)}}
@keyframes cue{50%{transform:scale(1.08);box-shadow:0 0 0 7px rgba(245,189,88,.5)}}
@keyframes cueSoft{50%{box-shadow:0 0 0 6px rgba(245,189,88,.55)}}
@keyframes hand{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}}
@keyframes dropin{0%{transform:translateY(-10px);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(20,157,161,.6),inset 0 -3px 0 rgba(0,0,0,.08)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(245,189,88,.45)}}
@keyframes ready{50%{box-shadow:0 4px 0 var(--blue-dk),0 0 0 6px rgba(44,111,209,.25)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .stage{grid-template-columns:1fr;gap:12px}
  .guide{position:sticky;top:0;display:grid;grid-template-columns:84px 1fr;gap:4px 10px;text-align:left;padding:10px;border-radius:0 0 18px 18px;margin:0 calc(-1 * clamp(10px,2.5vw,24px))}
  .ollie{width:86px}
  .bubble{margin-top:0;font-size:1rem;padding:10px 12px}
  .bubble::before{top:22px;left:-12px;margin:0;border:10px solid transparent;border-left:0;border-right:12px solid var(--blue-lt)}
  .guide-actions{grid-column:1/-1;justify-content:flex-start;margin-top:6px}
  .guide-actions .btn{min-height:40px;padding:6px 12px;font-size:.9rem}
  .step-name{display:none}
  .compare{grid-template-columns:1fr}
}
@media (max-width:480px){
  .progress .dot{width:30px;height:30px;font-size:.85rem}
  .controls .where{display:none}
  .pad{grid-template-columns:repeat(5,46px)}
  .key{height:48px}
  .mat{gap:8px}
  .col{padding:7px}
  .topbar .brand small{display:none}
  :root{--cube:32px;--rodw:20px;--seg:15px}
  .cubes{grid-template-columns:repeat(4,var(--cube));gap:4px}
  .rods{gap:3px;min-width:0}
  .rod{padding:2px}
  .compact .cubes{grid-template-columns:repeat(5,var(--cube))}
}
@media (prefers-reduced-motion:reduce){
  .cue.hand::after{display:none}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* =========================================================
   5. BASE-TEN ENGINE (reusable)
   A rod is exactly 10; a cube is exactly 1. Trading a rod
   removes one rod and adds exactly ten cubes (value preserved).
   ========================================================= */
class BlockModel{
  constructor(tens, ones){
    this.seq = 0; this.tens = []; this.ones = [];
    for (let i=0;i<tens;i++) this.tens.push(this._b('t'));
    for (let i=0;i<ones;i++) this.ones.push(this._b('o'));
  }
  _b(k){ return {id:k + (++this.seq), kind:k, removed:false, fresh:false}; }
  get tensOn(){ return this.tens.filter(b=>!b.removed).length; }
  get onesOn(){ return this.ones.filter(b=>!b.removed).length; }
  get tensTaken(){ return this.tens.filter(b=>b.removed).length; }
  get onesTaken(){ return this.ones.filter(b=>b.removed).length; }
  get value(){ return this.tensOn*10 + this.onesOn; }
  find(id){ return this.tens.find(b=>b.id===id) || this.ones.find(b=>b.id===id); }
  trade(id){
    const i = this.tens.findIndex(b=>b.id===id && !b.removed);
    if (i < 0) return false;
    const before = this.value;
    this.tens.splice(i,1);
    this.ones.forEach(b=>b.fresh=false);
    for (let k=0;k<10;k++){ const c=this._b('o'); c.fresh=true; this.ones.push(c); }
    console.assert(this.value === before, 'Trade must preserve value');
    return true;
  }
  remove(id){ const b=this.find(id); if (!b || b.removed) return false; b.removed=true; this.lastRemoved=id; return true; }
  restore(id){ const b=this.find(id); if (!b || !b.removed) return false; b.removed=false; return true; }
  removeOnes(n){ this.ones.filter(b=>!b.removed).slice(-n).forEach(b=>b.removed=true); }
}

/* ---------- Drag (enhancement only; every task also works by tapping) ---------- */
const Drag = {suppress:false};
function enableDrag(el, kind, id, o){
  let st=null, ghost=null, on=false, zone=null;
  el.addEventListener('pointerdown', e => { if (e.pointerType==='mouse' && e.button!==0) return; st={x:e.clientX,y:e.clientY,pid:e.pointerId}; });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId!==st.pid) return;
    if (!on){
      if (Math.hypot(e.clientX-st.x, e.clientY-st.y) < 12) return;
      on = true; try{ el.setPointerCapture(e.pointerId); }catch(_){}
      const r = el.getBoundingClientRect(); st.w=r.width; st.h=r.height;
      ghost = el.cloneNode(true); ghost.removeAttribute('data-key'); ghost.classList.add('drag-ghost');
      ghost.style.width = r.width+'px'; ghost.style.height = r.height+'px';
      document.body.append(ghost); el.classList.add('dragging');
    }
    e.preventDefault();
    ghost.style.transform = `translate(${e.clientX-st.w/2}px,${e.clientY-st.h/2}px) scale(1.08)`;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const z = under && under.closest('[data-drop]');
    if (z !== zone){ zone && zone.classList.remove('drop-over'); zone = z; zone && zone.classList.add('drop-over'); }
  });
  const end = cancel => {
    if (on){
      ghost.remove(); el.classList.remove('dragging'); zone && zone.classList.remove('drop-over');
      Drag.suppress = true; setTimeout(()=>Drag.suppress=false, 80);
      if (!cancel && zone) o.onDrop(kind, id, zone.dataset.drop, el);
    }
    st=null; on=false; ghost=null; zone=null;
  };
  el.addEventListener('pointerup', () => end(false));
  el.addEventListener('pointercancel', () => end(true));
}

function blockEl(b, o, inTray){
  const live = inTray ? !!o.onTrayTap : !!o.onTap;
  const isRod = b.kind === 't';
  const cls = [isRod?'rod':'cube'];
  if (!inTray && o.selected === b.id) cls.push('selected');
  if (!inTray && b.fresh && o.showFresh) cls.push('fresh');
  if (inTray) cls.push('gone');
  if (inTray && b.id === o.lastRemoved) cls.push('drop');
  if (!inTray && o.hl === (isRod?'tens':'ones')) cls.push('hl-blocks');
  const el = h(live?'button':'span', {class:cls.join(' '), 'data-key':'b-'+b.id+(inTray?'-tray':''), 'data-id':b.id, 'data-val': inTray?null:(isRod?10:1)});
  if (isRod) for (let i=0;i<10;i++) el.append(h('span',{class:'seg'}));
  else el.append(h('span',{class:'face'}));
  if (live){
    el.type = 'button';
    el.setAttribute('aria-label', inTray
      ? (isRod ? 'Taken-away ten. Tap to put it back.' : 'Taken-away one. Tap to put it back.')
      : (isRod ? 'Ten rod, worth 10' : 'One cube, worth 1'));
    if (isRod && !inTray) el.setAttribute('aria-pressed', o.selected===b.id ? 'true':'false');
    el.addEventListener('click', e => {
      if (Drag.suppress) return;
      e.stopPropagation();
      inTray ? o.onTrayTap(b.kind, b.id, el) : o.onTap(b.kind, b.id, el);
    });
    if (!inTray && o.onDrop) enableDrag(el, b.kind, b.id, o);
  }
  return el;
}

/* renderMat(model, options) → place-value mat with Tens, Ones and a take-away tray */
function renderMat(m, o = {}){
  const tensCol = h('div',{class:'col tens'+(o.hl==='tens'?' hl':''),'data-drop':'tens'},
    h('div',{class:'col-head'}, h('span',{},'Tens'), h('span',{class:'badge','aria-label':plural(m.tensOn,'ten')}, m.tensOn)),
    h('div',{class:'rods'}, m.tens.filter(b=>!b.removed).map(b=>blockEl(b,o,false))));
  const onesCol = h('div',{class:'col ones'+(o.hl==='ones'?' hl':'')+(o.onZone?' zone':''),'data-drop':'ones'},
    h('div',{class:'col-head'}, h('span',{},'Ones'), h('span',{class:'badge','aria-label':plural(m.onesOn,'one')}, m.onesOn)),
    h('div',{class:'cubes'}, m.ones.filter(b=>!b.removed).map(b=>blockEl(b,o,false))));
  if (o.onZone) onesCol.addEventListener('click', e => { if (!e.target.closest('.cube,.rod')) o.onZone('ones'); });
  const wrap = h('div',{class:'mat-wrap'+(o.compact?' compact':''), 'data-mat': o.name || 'main'}, h('div',{class:'mat'}, tensCol, onesCol));
  if (o.tray !== false){

    wrap.append(h('div',{class:'tray','data-drop':'tray'},

}

function eqStrip(m, cls = ''){
  const t = m.tensOn, o = m.onesOn;
  return h('div',{class:'eq '+cls,'aria-label':`${plural(t,'ten')} plus ${plural(o,'one')} equals ${m.value}`},
    h('span',{class:'chip t'}, plural(t,'ten')), '+', h('span',{class:'chip o'}, plural(o,'one')), '=', h('span',{class:'chip v'}, m.value));

/* Trade animation: the rod's ten segments fly to become the ten new cubes (exactly 10). */
function animateTrade(rodEl, apply){
  const segs = rodEl ? [...rodEl.querySelectorAll('.seg')].map(s=>s.getBoundingClientRect()) : [];
  apply();
  if (reduced() || segs.length !== 10) return;
  const targets = [...document.querySelectorAll('[data-mat="main"] .cubes .cube.fresh')];
  targets.forEach((t,i) => {
    const s = segs[i], r = t.getBoundingClientRect(); if (!s) return;
    const g = h('div',{class:'ghost-cube'});
    Object.assign(g.style,{left:s.left+'px',top:s.top+'px',width:s.width+'px',height:s.height+'px'});
    document.body.append(g); t.style.visibility='hidden';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      g.style.transition = `transform 650ms cubic-bezier(.3,1.3,.5,1) ${i*55}ms`;
      g.style.transform = `translate(${r.left-s.left+3}px,${r.top-s.top+3}px) scale(${(r.width-6)/s.width},${(r.height-6)/s.height})`;
    }));
    setTimeout(()=>{ g.remove(); t.style.visibility=''; }, 720 + i*55);
  });
}

/* Count-along: numbers appear on blocks one at a time. */
function countAlong(selector){
  const els = [...document.querySelectorAll(selector)];
  const tok = (App.countTok = (App.countTok||0)+1);
  els.forEach((el,i) => {
    const f = () => {
      if (tok !== App.countTok || !el.isConnected) return;
      let n = el.querySelector('.num'); if (!n){ n = h('span',{class:'num'}); el.append(n); }
      n.textContent = i+1; el.classList.add('counted');
      if (Voice.on) Voice.speak(String(i+1));
    };
    reduced() ? f() : setTimeout(f, 200 + i*700);
  });
}
/* Count-up: adds 10 for each rod and 1 for each cube, showing a running total. */
function countUp(root, out){
  const els = [...root.querySelectorAll('.mat [data-val]')];
  const tok = String(Date.now()+Math.random()); root.dataset.tok = tok;
  els.forEach(e=>e.classList.remove('counted'));
  let total = 0; out.textContent = '0';
  els.forEach((el,i) => {
    const f = () => {
      if (root.dataset.tok !== tok || !el.isConnected) return;
      total += +el.dataset.val; el.classList.add('counted'); out.textContent = total;
      if (i === els.length-1) Voice.speak(`Total: ${total}`);
    };
    reduced() ? f() : setTimeout(f, 250 + i*420);
  });
}

/* Number pad: tap digits or use the keyboard (0–9, Backspace, Enter). */
function numberPad(s, q, onCheck, max = 2){
  const press = d => { s.entry = (s.entry||'').length >= max ? d : (s.entry||'') + d; rerender(); };

/* Step-by-step slots shared by Moment 5 and the transfer problem */
function makeSlots(p){
  const [T,O] = p.top, [bt,bo] = p.bot;
  const t1 = T-1, o1 = O+10, oa = o1-bo, ta = t1-bt;
  return [
    {k:'t1', ans:t1, ask:p.ask[0],
      wrong:(v,w)=> w>=3 ? `${T} tens, break 1… that leaves <b>${t1}</b>. Type ${t1}.`
        : v===T ? `We broke 1 ten into ones, so we don't have ${T} tens anymore.`
        : v===T+1 ? `We broke a ten — so there's one <b>fewer</b> ten, not one more.`
        : `Look at the blocks. How many ten rods are left after we break one?`},
    {k:'o1', ans:o1, ask:p.ask[1],
      wrong:(v,w)=> w>=3 ? `${O} ones + 10 new ones = <b>${o1}</b>. Type ${o1}.`
        : v===10 ? `Those are the 10 new ones. Don't forget the <b>${O}</b> ones that were already there!`
        : v===O ? `Breaking the ten gave us 10 more ones. ${O} + 10 = ?`
        : `Count all the ones: the ${O} we had, plus the 10 from the ten.`},
    {k:'oa', ans:oa, ask:p.ask[2],
      wrong:(v,w)=> w>=3 ? `${o1} − ${bo} = <b>${oa}</b>. Type ${oa}.`
        : v===o1+bo ? `That's adding! We're taking <b>${bo}</b> away.`
        : v===bo-O ? `Careful — use the new ones number, ${o1}, not ${O}.`
        : `Start at ${o1} and count back ${bo}. The blocks can help!`},
    {k:'ta', ans:ta, ask:p.ask[3],
      wrong:(v,w)=> w>=3 ? `${t1} − ${bt} = <b>${ta}</b>. Type ${ta}.`
        : v===t1 ? `Don't forget to take away the ${plural(bt,'ten')}!`
        : v===T-bt ? `Remember, we crossed out the ${T}. We have <b>${t1}</b> tens now.`
        : `We have ${plural(t1,'ten')}. Take away ${bt}. How many are left?`}
  ];
}

/* =========================================================
   PRACTICE-STYLE PROBLEM CARD
   Same setup as the Pip practice tool: tap a top number to
   cross it out, write its new value in the green box above,
   one answer box per place, then "Check my work".
   ========================================================= */
const PLACE_NAMES = ['tens','ones'];
function practiceCard(s, A, B, hooks){
  const g = s.g || (s.g = {work:['',''], struck:[false,false], ans:['',''], fb:{text:'',cls:''}, wrongKeys:[]});
  const ad = String(A).split('').map(Number), bd = String(B).split('').map(Number);
  const grid = h('div',{class:'pgrid'});
  const put = (e,col,row) => { e.style.gridColumn = col; e.style.gridRow = row; grid.append(e); return e; };
  const cls = (base,key) => base + (g.wrongKeys.includes(key)?' wrong':'') + (hooks.target===key?' target':'');
  const clearWrong = (el,key) => { el.classList.remove('wrong'); g.wrongKeys = g.wrongKeys.filter(k=>k!==key); };
  for (let i=0;i<2;i++){
    const w = put(h('input',{class:cls('pwork','pw-'+i), type:'text', inputmode:'numeric', autocomplete:'off', maxlength:'2', disabled:hooks.locked||null,
      'data-key':'pw-'+i, 'aria-label':`New top number for the ${PLACE_NAMES[i]}`}), 2+i, 1);
    w.value = g.work[i];
    const d = put(h('div',{class:cls('pdigit tap'+(g.struck[i]?' struck':'')+(hooks.colFocus===PLACE_NAMES[i]?' colfocus':''),'pd-'+i), role:'button', tabindex:'0', 'data-key':'pd-'+i,
      'aria-pressed':String(g.struck[i]), 'aria-label':`Top ${PLACE_NAMES[i]} digit ${ad[i]}. Tap to cross out.`}, ad[i]), 2+i, 2);
    const setStruck = on => { g.struck[i] = on; d.classList.toggle('struck', on); d.setAttribute('aria-pressed', String(on)); };
    const flip = () => { if (hooks.locked){ hooks.onLocked && hooks.onLocked(); return; } setStruck(!g.struck[i]); hooks.onChange('pd-'+i); };
    d.addEventListener('click', flip);
    d.addEventListener('keydown', e => { if (e.key===' ' || e.key==='Enter'){ e.preventDefault(); flip(); } });
    w.addEventListener('input', () => {
      w.value = w.value.replace(/[^0-9]/g,'').slice(0,2); g.work[i] = w.value; clearWrong(w,'pw-'+i);
      if (w.value && !g.struck[i]) setStruck(true);
      hooks.onChange('pw-'+i);
    });
    w.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); hooks.onCheck(); } });
  }
  put(h('div',{class:'pop','aria-label':'minus'},'−'), 1, 3);
  bd.forEach((v,i) => put(h('div',{class:'pdigit'+(hooks.colFocus===PLACE_NAMES[i]?' colfocus':''),'data-key':'pb-'+i}, v), 2+i, 3));
  put(h('div',{class:'prule'}), '1 / -1', 4);
  const boxes = [];
  for (let i=0;i<2;i++){
    const b = put(h('input',{class:cls('pbox','pa-'+i), type:'text', inputmode:'numeric', autocomplete:'off', maxlength:'1', disabled:hooks.locked||null,
      'data-key':'pa-'+i, 'aria-label':`answer box, ${PLACE_NAMES[i]}`}), 2+i, 5);
    b.value = g.ans[i]; boxes.push(b);
    b.addEventListener('input', () => {
      b.value = b.value.replace(/[^0-9]/g,'').slice(0,1); g.ans[i] = b.value; clearWrong(b,'pa-'+i);
      const L = boxes[i-1], R = boxes[i+1];          // work right to left, like practice
      if (b.value !== '' && L && L.value === '' && (!R || R.value !== '')) L.focus();
      hooks.onChange('pa-'+i);
    });
    b.addEventListener('keydown', e => {
      if (e.key==='ArrowLeft' && i>0){ e.preventDefault(); boxes[i-1].focus(); }
      if (e.key==='ArrowRight' && i<boxes.length-1){ e.preventDefault(); boxes[i+1].focus(); }
      if (e.key==='Enter'){ e.preventDefault(); hooks.onCheck(); }
    });
  }
  return h('div',{class:'pcard'},
    h('p',{class:'pkind'},'Subtraction'),
    h('p',{class:'phint'},'Tap a top number to cross it out, then write its new value above.'),
    grid,
    h('div',{class:'pfeedback '+g.fb.cls,'aria-live':'polite'}, g.fb.text),
    h('div',{class:'pactions'}, h('button',{class:'pbtn'+(hooks.target==='pcheck'?' target':''),type:'button','data-key':'pcheck',onclick:hooks.onCheck,hidden:(hooks.done||hooks.locked)||null},'Check my work')));
}
function setTarget(key){
  document.querySelectorAll('.pcard .target').forEach(e=>e.classList.remove('target'));
  const e = key && document.querySelector(`.pcard [data-key="${key}"]`); e && e.classList.add('target');
}
/* Attach the box each guided step lives in. */
function withKeys(slots){
  const map = {t1:['pw-0',g=>g.work[0]], o1:['pw-1',g=>g.work[1]], oa:['pa-1',g=>g.ans[1]], ta:['pa-0',g=>g.ans[0]]};
  return slots.map(x => ({...x, key:map[x.k][0], get:map[x.k][1], len:String(x.ans).length}));
}
/* What to pulse next: the top digit to cross out first, then its green box, then the answer boxes. */
function targetKey(s, SL){
  const cur = SL[s.prog]; if (!cur) return 'pcheck';
  const i = +cur.key.slice(-1);
  return cur.key.startsWith('pw-') && !(s.g && s.g.struck[i]) ? 'pd-'+i : cur.key;
}
function stepProgress(g, SL){ let p = 0; while (p < SL.length && SL[p].get(g) === String(SL[p].ans)) p++; return p; }
function wrongFields(g, SL, prog){
  return SL.filter((x,i) => i >= prog && x.get(g) !== '' && x.get(g) !== String(x.ans)).map(x=>x.key)
           .concat(SL[prog] && SL[prog].get(g)==='' ? [SL[prog].key] : []);
}
/* Live guidance as the child writes: advance Ollie, or coach the box they just finished. */
function guideStep(s, SL, field, allDone){
  const g = s.g; if (!g) return;
  const p = stepProgress(g, SL);
  if (p > s.prog){
    s.prog = p; s.wrong = 0;
    if (field) say(s, 'Yes! ' + (SL[p] ? SL[p].ask : (allDone || '')), 'happy');
  } else if (p < s.prog) s.prog = p;
  const cur = SL[s.prog];
  setTarget(targetKey(s, SL));
  if (!field || !cur) return;
  if (field === 'pd-'+(s.prog===0?0:1) && s.prog < 2 && g.struck[s.prog] && !g.work[s.prog]){ say(s, s.prog===0 ? 'Good, it’s crossed out! Now write the new number of <b>tens</b> in the green box.' : 'Crossed out! Now write the new number of <b>ones</b> in the green box.','happy'); return; }
  if (field !== cur.key) return;
  const v = cur.get(g);
  if (v.length >= cur.len && v !== String(cur.ans)){
    s.wrong++; if (s.wrong >= 2) s.showBlocks = s.blocks = true;
    g.wrongKeys = g.wrongKeys.filter(k=>k!==cur.key).concat(cur.key);
    const el = document.querySelector(`.pcard [data-key="${cur.key}"]`); el && el.classList.add('wrong');
    say(s, cur.wrong(+v, s.wrong), 'think');
  }
}
/* Side panel for Moment 5: optional blocks that follow the written steps, plus the step-by-step links. */
function fillSide(s, side, o){
  const [T,O] = String(o.A).split('').map(Number), [bt,bo] = String(o.B).split('').map(Number);
  const m = s.prog >= 1 ? new BlockModel(T-1, O+10) : new BlockModel(T, O);
  if (s.prog >= 3) m.removeOnes(bo);
  if (s.prog >= 4) m.tens.slice(-bt).forEach(b=>b.removed=true);
  m.lastRemoved = null;
  const isEnough = s.phase === 'enough';
  side.replaceChildren(...[
    isEnough ? needRow(O, bo, s.tried && s.tried.length > 0) : null,
    h('button',{type:'button',class:'btn btn-soft btn-sm','data-key':'blocks','aria-expanded':String(s.showBlocks),
      onclick:()=>{ s.showBlocks = !s.showBlocks; fillSide(s, side, o); }}, s.showBlocks ? o.toggleLabel[1] : o.toggleLabel[0]),
    s.showBlocks ? h('div',{style:'margin-top:8px'}, renderMat(m,{compact:true, name:'ref'}), eqStrip(m)) : null,
    h('ul',{class:'links'}, (o.pre ? [h('li',{html:o.pre})] : []).concat(o.links.slice(0, s.prog).map(t=>h('li',{html:t}))))].filter(Boolean));
}

/* "We need 7" strip: the ones we have fill the boxes we need, so 1st graders can SEE enough / not enough. */
function needRow(have, need, show){
  const filled = Math.min(have, need), extra = Math.max(0, have - need);
  return h('div',{class:'need','aria-label':`We need ${need} ones. We have ${have}.`},
    h('span',{class:'lbl'}, `We need ${need} ones:`),

  'Tens: <b>4 − 2</b>. Write it in the tens box.']}));
const LINKS6 = ['<b>5 → 4</b> · We broke 1 ten into ones.','<b>3 → 13</b> · The 10 new ones joined the 3 ones.','<b>13 − 8 = 5</b> · We took away 8 ones.','<b>4 − 2 = 2</b> · We took away 2 tens.'];
STEPS.push({
  id:'m6', cue:s=> s.guided && !s.done ? {sel:'.pcard .target', hand:false} : null, label:'Your Turn', kicker:'Quick Check',
  init:()=>({guided:false, prog:0, wrong:0, hint:0, blocks:false, model:new BlockModel(5,3), selected:null, done:false, complete:false,
    line:{mood:'happy', text:'Your turn! Solve <b>53 − 28</b>. Use blocks if you want. Then tap <b>Check my work</b>.'}}),
  render(s){
    const m = s.model;
    const startGuided = pre => { s.guided = true; s.blocks = true; s.wrong = 0; s.prog = 0; guideStep(s, SLOTS6, null); say(s, (pre||'') + (SLOTS6[s.prog] ? SLOTS6[s.prog].ask : 'Tap <b>Check my work</b>!'), 'think'); };
    const onCheck = () => {
      const g = s.g, ans = g.ans.join('');
      if (!g.ans[0] && !g.ans[1]){ g.fb = {text:'Type your answer in the boxes first!', cls:'fix'}; rerender(); return; }
      if (ans === '25'){
        s.done = true; g.wrongKeys = []; g.fb = {text:'Great job! 53 − 28 = 25.', cls:'good'};
        say(s,'<b>53 − 28 = 25!</b> You broke a ten, just like before. You really understand regrouping!','cheer'); complete(s);
      } else {
        s.wrong++;
        g.wrongKeys = [g.ans[0]!=='2'?'pa-0':null, g.ans[1]!=='5'?'pa-1':null].filter(Boolean);
        if (s.guided) g.wrongKeys = g.wrongKeys.concat(wrongFields(g, SLOTS6, s.prog));
        g.fb = {text:'Almost! Look at the red boxes. Here’s a clue:', cls:'fix'};
        if (s.guided){ guideStep(s, SLOTS6, null); const cur = SLOTS6[s.prog]; say(s, cur ? (cur.get(g) ? cur.wrong(+cur.get(g), s.wrong) : cur.ask) : 'Check each box again.', 'think'); }
        else if (ans === '35' && s.wrong === 1) say(s,'The ones are right! But look at the tens. When we break a ten, the 5 tens become <b>4</b>. Cross out the 5 and write 4 above it.','think');
        else if (s.wrong === 1){ s.blocks = true; say(s,'Not quite. Can we take 8 ones from 3 ones? Break a ten first — the blocks can help!','think'); }
        else startGuided("Let's do it together, step by step. ");
      }
      rerender();
    };
    const card = practiceCard(s, 53, 28, {
      target: s.guided && !s.done ? targetKey(s, SLOTS6) : null, done: s.done,
      onChange:(field) => { if (s.guided){ guideStep(s, SLOTS6, field, 'Everything is filled in! Tap <b>Check my work</b>.'); refresh(); } },
      onCheck});
    // Optional blocks workbench
    const wbTap = (k,id) => {
      if (k === 't'){ s.selected = s.selected===id ? null : id; if (s.selected) say(s,'Ten picked up. Break it into ones, or take it away.'); rerender(); return; }
      s.selected = null; m.remove(id); rerender();
    };
    const wbTrade = id => { const el = document.querySelector(`[data-mat="main"] .rod[data-id="${id}"]`); animateTrade(el,()=>{ m.trade(id); s.selected=null; say(s,`Crack! Now there are ${m.onesOn} ones.`,'wow'); rerender(); }); };
    const wbTake = id => { m.remove(id); s.selected = null; rerender(); };
    const bench = () => h('div',{style:'margin-top:10px'},
      renderMat(m,{selected:s.selected, showFresh:true, onTap:wbTap, onTrayTap:(k,id)=>{ m.restore(id); rerender(); },
        onZone:()=>{ if (s.selected) wbTrade(s.selected); },
        onDrop:(k,id,zone)=>{ if (k==='t' && zone==='ones') wbTrade(id); else if (zone==='tray') wbTake(id); }}),
      s.selected ? h('div',{class:'action-bar'},
        h('button',{type:'button',class:'btn btn-gold','data-key':'wb-trade',onclick:()=>wbTrade(s.selected)},'💥 Break into ones'),
        h('button',{type:'button',class:'btn btn-soft','data-key':'wb-take',onclick:()=>wbTake(s.selected)},'✖ Take it away')) : null,
      eqStrip(m),
      h('p',{class:'tip'}, `Taken away: ${plural(m.tensTaken,'ten')}, ${plural(m.onesTaken,'one')}. Tap a cube to take it away. Tap a rod to break it or take it away.`),
      h('button',{type:'button',class:'btn btn-soft btn-sm','data-key':'wb-reset',onclick:()=>{ s.model=new BlockModel(5,3); s.selected=null; rerender(); }},'↺ Reset blocks'));
    const linksEl = h('ul',{class:'links'});
    const refresh = () => linksEl.replaceChildren(...(s.guided ? LINKS6.slice(0, s.prog).map(t=>h('li',{html:t})) : []));
    refresh();
    const side = h('div',{class:'side'},
      h('button',{type:'button',class:'btn btn-soft btn-sm','data-key':'blocks','aria-expanded':String(s.blocks),
        onclick:()=>{ s.blocks=!s.blocks; rerender(); }}, s.blocks?'🧱 Hide the blocks':'🧱 Use blocks'),
      linksEl,
      !s.guided && !s.done ? h('div',{class:'extra'}, h('button',{type:'button',class:'btn btn-soft btn-sm','data-key':'steps',onclick:()=>{ startGuided('Sure! '); rerender(); }},'🪜 Show me the steps')) : null);
    return h('div',{}, head(this.kicker,'53 − 28'), h('div',{class:'algo-layout'}, card, side),
      s.blocks ? h('div',{class:'bench'}, h('h3',{class:'bench-title'},'🧱 Blocks for 53'), bench()) : null,
      s.done ? h('div',{class:'banner'},'✓ 53 − 28 = 25') : null);
  },
  help(s){
    if (s.done){ say(s,'Tap <b>Next</b>!','happy'); return; }
    s.hint++; s.blocks = true;
    if (!s.guided && s.hint === 1){ say(s,'Look at the ones. We have 3 ones and need to take away 8. What did we do last time?','think'); return; }
    if (!s.guided){ s.guided = true; s.prog = 0; guideStep(s, SLOTS6, null); say(s,"Let's go step by step. " + (SLOTS6[s.prog] ? SLOTS6[s.prog].ask : 'Tap <b>Check my work</b>!'),'think'); return; }
    const cur = SLOTS6[s.prog];
    say(s, cur ? cur.wrong(-1, s.hint >= 3 ? 3 : 1) : 'Everything is filled in. Tap <b>Check my work</b>!', 'think');
  }
});

/* ---------- Finish ---------- */
STEPS.push({
  id:'finish', label:'Done', noHelp:true,
  init:()=>({complete:true, line:{mood:'cheer', text:'You did it! You discovered that trading one ten for ten ones doesn’t change the number. Now you know <b>why regrouping works</b>!'}}),
  render(){
    return h('div',{},
      h('div',{class:'kicker'},'Lesson complete'),
      h('h2',{class:'work-title',id:'work-title',tabindex:'-1'},'You discovered the Great Ten Trade!'),
      h('div',{class:'learned'}, h('h3',{},'What you figured out'),
        h('ul',{}, h('li',{},'1 ten = 10 ones.'),
          h('li',{},'Breaking a ten doesn’t change the number. 4 tens + 2 ones = 3 tens + 12 ones = 42.'),
          h('li',{},'Not enough ones? Break a ten! 42 − 17 = 25 and 53 − 28 = 25.'))),
      h('div',{class:'next-steps'},
        h('a',{class:'btn btn-pip btn-big',href:CONFIG.practiceURL||'#','data-key':'practice'},'Practice with Pip →'),
        h('button',{type:'button',class:'btn btn-soft','data-key':'again',onclick:()=>{ App.states={}; App.max=0; go(0); }},'↺ Try the lesson again'),
        CONFIG.libraryURL ? h('a',{class:'btn btn-soft',href:CONFIG.libraryURL},'🏠 Curiosity Engine library') : null));
  }
});

/* =========================================================
   8. APP SHELL — navigation, progress, guide, keyboard
   ========================================================= */
const App = {step:0, max:0, states:{}, pad:null, mood:null};
function S(){ const st = STEPS[App.step]; return App.states[st.id] || (App.states[st.id] = st.init()); }
function say(s, text, mood = 'neutral'){ s.line = {text, mood}; drawGuide(s, true); Voice.speak(text); }
function complete(s){ s.complete = true; App.max = Math.max(App.max, App.step+1); drawProgress(); drawNav(s, true); }
function canNext(s){ return s.complete || App.max > App.step; }

function drawGuide(s, fresh){
  const mood = s.line.mood || 'neutral';
  let img = $('#ollie img');
  if (!img){ img = h('img',{class:'ollie',src:OLLIE_SRC,alt:'Ollie the Otter',width:'440',height:'390'}); $('#ollie').append(img); }
  if (fresh || mood !== App.mood){
    img.className = 'ollie'; void img.offsetWidth; img.classList.add('mood-'+mood); App.mood = mood;
  }
  const b = $('#bubble'); b.innerHTML = s.line.text;
  if (fresh){ b.classList.remove('fresh'); void b.offsetWidth; b.classList.add('fresh'); }
  $('#helpBtn').hidden = !!STEPS[App.step].noHelp;
  const tr = $('#tracker'), st = STEPS[App.step], el = st.tracker ? st.tracker(s) : null;
  tr.replaceChildren(...(el ? [el] : [])); tr.hidden = !el;
}
function drawProgress(){
  const ol = $('#progress'); ol.replaceChildren();
  STEPS.forEach((st,i) => {
    if (i === 0) return;
    const done = i < App.step || (App.states[st.id] && App.states[st.id].complete && i !== App.step) ;
    const li = h('li',{class: (i <= App.max && i < App.step) || done ? 'done' : ''},
      h('button',{type:'button',class:'dot','aria-label':`${st.label}${i===App.step?' (current)':''}`, title:st.label,
        'aria-current': i===App.step ? 'step' : null, disabled: i > App.max ? true : null, onclick:()=>go(i)},
        i === STEPS.length-1 ? '★' : (i < App.step && i <= App.max ? '✓' : i)));
    ol.append(li);
  });
  const st = STEPS[App.step];
  $('#stepName').textContent = App.step === 0 ? 'Welcome' : (st.kicker ? `${st.kicker} · ${st.label}` : st.label);
}
function drawNav(s, justDone){
  $('#backBtn').disabled = App.step === 0;
  $('#backBtn').style.visibility = App.step === 0 ? 'hidden' : '';
  const nb = $('#nextBtn');
  nb.style.visibility = App.step === STEPS.length-1 ? 'hidden' : '';
  nb.setAttribute('aria-disabled', canNext(s) ? 'false' : 'true');
  nb.classList.toggle('ready', !!(justDone && canNext(s)));
  $('#where').textContent = App.step === 0 ? '' : `${STEPS[App.step].label}`;
}
function render(entering){
  const st = STEPS[App.step], s = S();
  if (s.complete) App.max = Math.max(App.max, App.step+1);
  const fk = !entering && document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  App.pad = null;
  $('#work').replaceChildren(st.render(s));
  drawGuide(s, entering); drawProgress(); drawNav(s); applyCue();
  if (entering && !$('#tracker').hidden && !reduced()){ const t = $('#tracker .tracker'); t && t.classList.add('slide-in'); }
  if (s._after){ const f = s._after; s._after = null; requestAnimationFrame(f); }
  if (entering){
    const t = $('#work-title'); t && t.focus({preventScroll:true});
    window.scrollTo({top:0, behavior: reduced() ? 'auto' : 'smooth'});
    Voice.speak(s.line.text);
  } else if (fk){
    let el = document.querySelector(`[data-key="${fk}"]`);
    if (!el && fk.startsWith('b-')) el = document.querySelector(`[data-mat="main"] .mat button.${fk[2]==='t'?'rod':'cube'}`) || document.querySelector('.pad .key');
    if (!el) el = $('#work-title');
    el && el.focus({preventScroll:true});
  }
}
function rerender(){ render(false); }
/* Pulse whatever the child should touch next; the first one also gets a tapping hand. */
function applyCue(){
  document.querySelectorAll('.cue').forEach(e=>e.classList.remove('cue','hand'));
  const st = STEPS[App.step], s = S();
  const c = st.cue ? st.cue(s) : null; if (!c) return;
  const els = [...document.querySelectorAll(c.sel)];
  els.forEach(e=>e.classList.add('cue'));
  if (c.hand !== false && els[0]) els[0].classList.add('hand');
}
function go(i){
  if (i < 0 || i >= STEPS.length || i > App.max) return;
  App.countTok = (App.countTok||0)+1;
  document.querySelectorAll('.ghost-cube,.drag-ghost').forEach(g=>g.remove());
  App.step = i; render(true);
}
function restartStep(){ const st = STEPS[App.step]; App.states[st.id] = st.init(); render(true); }

$('#nextBtn').addEventListener('click', () => {
  const s = S();
  if (!canNext(s)){
    say(s, 'First, finish the job on this page. Need a clue? Tap <b>💡 Help me</b>.', 'think');
    const hb = $('#helpBtn'); hb.classList.remove('shake'); void hb.offsetWidth; hb.classList.add('shake');
    return;
  }
  go(App.step+1);
});
$('#backBtn').addEventListener('click', () => go(App.step-1));
$('#helpBtn').addEventListener('click', () => { const st = STEPS[App.step]; if (st.help){ st.help(S()); rerender(); } });
$('#againBtn').addEventListener('click', () => Voice.speak(S().line.text, true));
$('#readBtn').addEventListener('click', e => {
  if (!Voice.ok){ say(S(),'Sorry — this browser can’t read aloud.','think'); return; }
  Voice.touched = true; Voice.on = !Voice.on; e.currentTarget.setAttribute('aria-pressed', String(Voice.on));
  Voice.on ? Voice.speak(S().line.text) : Voice.stop();
});
if (!Voice.ok) $('#againBtn').hidden = true;
if (CONFIG.libraryURL){ const hb = $('#homeBtn'); hb.href = CONFIG.libraryURL; hb.hidden = false; }

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (App.pad){
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); App.pad.press(e.key); return; }
    if (e.key === 'Backspace'){ e.preventDefault(); App.pad.back(); return; }
    if (e.key === 'Enter'){
      const a = document.activeElement;
      if (S().entry && !(a && a.closest('.pad'))){ e.preventDefault(); App.pad.check(); return; }
      if (!a || a === document.body || a.closest('.pad') || a.id === 'work' || a.id === 'work-title'){ e.preventDefault(); App.pad.check(); }
      return;
    }
  }
  if (e.key === 'Escape'){ const s = S(); if (s.selected){ s.selected = null; rerender(); } }
});

render(true);
</script>
</body>
